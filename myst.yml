# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  title: "Welcome"
  authors:
    - name: Max Grover
      website: https://blog.mgrover.dev
      orcid: 0000-0002-0370-8974
      github: mgrover1
  github: https://github.com/mgrover1/blog
  plugins:
    - type: executable
      path: src/blogpost.py
    - src/socialpost.mjs
  toc:
    - file: index.md
    - file: about.md
    - file: projects.md
    - file: talks.md
    - file: workshops.md
    - file: media.md
    - file: blog.md
      children:
      - title: "2026"
        children:
        - pattern: "posts/2026/**{.ipynb,.md}"
      - title: "2025"
        children:
        - pattern: "posts/2025/**{.ipynb,.md}"
      - title: "2023"
        children:
        - pattern: "posts/2023/**{.ipynb,.md}"
      - title: "2022"
        children:
        - pattern: "posts/2022/**{.ipynb,.md}"
      - title: "2021"
        children:
        - pattern: "posts/2021/**{.ipynb,.md}"
    
site:
  template: book-theme
  options:
    folders: true
    logo_text: Max Grover
    favicon: _static/profile-pic-circle.jpg
  domains:
    - mgrover1.github.io
  nav:
    - title: About
      url: /about
    - title: Projects
      url: /projects
    - title: Talks
      url: /talks
    - title: Workshops
      url: /workshops
    - title: Media
      url: /media
    - title: Blog
      url: /blog
